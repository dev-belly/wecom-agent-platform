name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: '3.12'
      - run: uv sync --locked --extra dev
      - run: uv run --locked ruff check .
      - run: uv run --locked pytest -q
      - run: uv build --wheel --out-dir dist
      - name: Verify installed wheel outside the source tree
        run: |
          uv pip install --python .venv/bin/python --reinstall --no-deps dist/*.whl
          .venv/bin/python -I -c "import src.main, src.config.settings, src.agents.financial_agent; assert 'site-packages' in src.main.__file__; print(src.main.__file__)"

  backend-windows:
    runs-on: windows-latest
    steps:
      - name: Exercise Windows checkout conversion
        run: git config --global core.autocrlf true
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: '3.12'
      - run: uv sync --locked --extra dev
      - run: uv run --locked ruff check .
      - name: Offline API and retrieval tests with native encoding
        env:
          PYTHONUTF8: '0'
        run: uv run --locked pytest -q
      - run: uv build --wheel --out-dir dist
      - name: Verify installed wheel outside the source tree
        run: |
          $wheel = (Get-ChildItem -Path dist -Filter '*.whl').FullName
          uv pip install --python .venv/Scripts/python.exe --reinstall --no-deps $wheel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .venv/Scripts/python.exe -I -c "import src.main, src.config.settings, src.agents.financial_agent; assert 'site-packages' in src.main.__file__; print(src.main.__file__)"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --registry=https://registry.npmjs.org
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
