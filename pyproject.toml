[project]
name = "wecom-agent-platform"
version = "0.1.0"
description = "企微智能运营 Agent 平台 - 金融合同与产品要素查询"
requires-python = ">=3.12,<3.14"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",

    # LLM & Agent
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "langgraph>=0.2.0",
    "openai>=1.50.0",

    # PDF parsing
    "pdfplumber>=0.11.0",
    "PyMuPDF>=1.24.0",
    "pillow>=10.4.0",
    "tabulate>=0.9.0",

    # Lightweight retrieval
    "rank-bm25>=0.2.2",

    # Quantitative / factor analysis
    "numpy>=1.26.0",
    "pandas>=2.1.0",

    # Utils
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "httpx>=0.27.0",
    "cachetools>=5.3.0",
    "aiocache>=0.12.0",
    "tenacity>=8.5.0",
    "loguru>=0.7.0",
    "python-multipart>=0.0.9",

    # WeCom callback cryptography
    "cryptography>=42.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
]
retrieval = [
    "sentence-transformers>=3.0.0",
    "chromadb>=0.5.0",
    "flagembedding>=1.2.0",
]
inference = [
    "vllm>=0.6.0; sys_platform == 'linux'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]
"src/factors/factor_backtest.py" = ["E402"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
